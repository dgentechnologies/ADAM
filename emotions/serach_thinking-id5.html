<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADAM — Search / Thinking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: monospace;
  }
  .label {
    color: #fff;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0.4;
  }
  svg { width: 320px; height: 200px; overflow: visible; }
  /* Wave eyes scroll horizontally */
  .eye-l { animation: wave-scroll-l 1.8s linear infinite; }
  .eye-r { animation: wave-scroll-r 1.8s linear infinite 0.3s; }
  .mouth { animation: mouth-scan 1.8s ease-in-out infinite; transform-origin: 160px 138px; }
  .scan-line { animation: scan 1.2s linear infinite; }
  @keyframes wave-scroll-l {
    0% { transform: translateX(-8px); }
    100% { transform: translateX(8px); }
  }
  @keyframes wave-scroll-r {
    0% { transform: translateX(8px); }
    100% { transform: translateX(-8px); }
  }
  @keyframes mouth-scan {
    0%,100% { transform: scaleX(1); opacity: 0.7; }
    50% { transform: scaleX(1.08); opacity: 1; }
  }
  @keyframes scan {
    0% { transform: translateY(-60px); opacity: 0; }
    30% { opacity: 0.3; }
    70% { opacity: 0.3; }
    100% { transform: translateY(60px); opacity: 0; }
  }
</style>
</head>
<body>
<div class="label">ADAM · Search / Thinking</div>
<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Vertical scan line -->
  <line class="scan-line" x1="160" y1="10" x2="160" y2="190" stroke="#fff" stroke-width="1" opacity="0"/>
  <!-- Left eye: zigzag wave ~ ~ -->
  <g class="eye-l">
    <path d="M 72 88 Q 82 78 92 88 Q 102 98 112 88 Q 122 78 132 88"
      stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Right eye: zigzag wave -->
  <g class="eye-r">
    <path d="M 182 88 Q 192 78 202 88 Q 212 98 222 88 Q 232 78 242 88"
      stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Mouth: straight flat line -->
  <g class="mouth">
    <line x1="135" y1="138" x2="185" y2="138" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
