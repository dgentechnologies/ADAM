<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADAM — Love</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
  }
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: monospace;
    overflow: hidden;
    background: transparent;
  }
  .label {
    display: none;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .heart-l { animation: heartbeat 1.1s ease-in-out infinite; transform-origin: 105px 88px; }
  .heart-r { animation: heartbeat 1.1s ease-in-out infinite 0.55s; transform-origin: 215px 88px; }
  .mouth { animation: smile-love 2s ease-in-out infinite; transform-origin: 160px 140px; }
  .float-1 { animation: heart-float 2.5s ease-in-out infinite 0.5s; }
  .float-2 { animation: heart-float 2.5s ease-in-out infinite 1.2s; }
  .float-3 { animation: heart-float 2.5s ease-in-out infinite 1.8s; }
  .pulse-ring-l { animation: love-ring 1.1s ease-out infinite; transform-origin: 105px 88px; }
  .pulse-ring-r { animation: love-ring 1.1s ease-out infinite 0.55s; transform-origin: 215px 88px; }

  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    14% { transform: scale(1.22); }
    28% { transform: scale(1); }
    42% { transform: scale(1.12); }
    56%,100% { transform: scale(1); }
  }
  @keyframes smile-love {
    0%,100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-2px) scaleX(1.05); }
  }
  @keyframes heart-float {
    0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
    20% { opacity: 0.7; transform: translate(0, -8px) scale(0.8); }
    100% { transform: translate(10px, -50px) scale(0.4); opacity: 0; }
  }
  @keyframes love-ring {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(2.4); opacity: 0; }
  }
</style>
</head>
<body>
<div class="label">ADAM · Love</div>
<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Pulse rings -->
  <path class="pulse-ring-l"
    d="M 105 73 C 105 68 100 63 94 66 C 88 63 83 68 83 73 C 83 80 105 95 105 95 C 105 95 127 80 127 73 C 127 68 122 63 116 66 C 110 63 105 68 105 73 Z"
    stroke="#fff" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path class="pulse-ring-r"
    d="M 215 73 C 215 68 210 63 204 66 C 198 63 193 68 193 73 C 193 80 215 95 215 95 C 215 95 237 80 237 73 C 237 68 232 63 226 66 C 220 63 215 68 215 73 Z"
    stroke="#fff" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Left heart eye -->
  <g class="heart-l">
    <path d="M 105 73 C 105 68 100 63 94 66 C 88 63 83 68 83 73 C 83 80 105 97 105 97 C 105 97 127 80 127 73 C 127 68 122 63 116 66 C 110 63 105 68 105 73 Z"
      stroke="#fff" stroke-width="4" fill="none"/>
  </g>
  <!-- Right heart eye -->
  <g class="heart-r">
    <path d="M 215 73 C 215 68 210 63 204 66 C 198 63 193 68 193 73 C 193 80 215 97 215 97 C 215 97 237 80 237 73 C 237 68 232 63 226 66 C 220 63 215 68 215 73 Z"
      stroke="#fff" stroke-width="4" fill="none"/>
  </g>

  <!-- Small smile mouth -->
  <g class="mouth">
    <path d="M 145 138 Q 160 150 175 138"
      stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating hearts -->
  <g class="float-1">
    <path d="M 260 130 C 260 128 258 126 256 127 C 254 126 252 128 252 130 C 252 133 260 138 260 138 C 260 138 268 133 268 130 C 268 128 266 126 264 127 C 262 126 260 128 260 130 Z"
      fill="#fff" opacity="0.6"/>
  </g>
  <g class="float-2">
    <path d="M 52 145 C 52 143 50 141 48 142 C 46 141 44 143 44 145 C 44 148 52 153 52 153 C 52 153 60 148 60 145 C 60 143 58 141 56 142 C 54 141 52 143 52 145 Z"
      fill="#fff" opacity="0.5"/>
  </g>
  <g class="float-3">
    <path d="M 272 90 C 272 88.5 271 87 269.5 87.5 C 268 87 267 88.5 267 90 C 267 92 272 95 272 95 C 272 95 277 92 277 90 C 277 88.5 276 87 274.5 87.5 C 273 87 272 88.5 272 90 Z"
      fill="#fff" opacity="0.4"/>
  </g>
</svg>
</body>
</html>
