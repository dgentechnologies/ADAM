<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADAM — Rizz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: monospace;
  }
  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 28px;
    opacity: 0.3;
  }
  svg { width: 340px; height: 220px; overflow: visible; }

  /* Left eye: closed flat line (wink) — animates shut then open once then stays closed */
  .wink-eye { animation: wink-anim 2.8s ease-in-out infinite; transform-origin: 105px 90px; }
  /* Right eye: confident arc */
  .cool-eye { animation: cool-squint 2.8s ease-in-out infinite; transform-origin: 215px 90px; }
  /* Smirk */
  .smirk { animation: smirk-pulse 2.8s ease-in-out infinite; transform-origin: 167px 140px; }
  /* Sparkle / gleam on the winking side */
  .gleam { animation: gleam-flash 2.8s ease-in-out infinite 1.4s; transform-origin: 260px 62px; }
  /* Subtle lean */
  .face { animation: lean 2.8s ease-in-out infinite; transform-origin: 160px 100px; }

  @keyframes wink-anim {
    0%,100% { transform: scaleY(1); }
    /* eyes closed for wink phase */
    10%,35% { transform: scaleY(0.05); }
    45% { transform: scaleY(1); }
  }
  @keyframes cool-squint {
    0%,100% { transform: scaleY(1); }
    /* slight squint during wink */
    10%,35% { transform: scaleY(0.75); }
    45% { transform: scaleY(1); }
  }
  @keyframes smirk-pulse {
    0%,100% { transform: scale(1) translateX(0); }
    50% { transform: scale(1.04) translateX(2px); }
  }
  @keyframes gleam-flash {
    0%,100% { opacity: 0; transform: scale(0) rotate(0deg); }
    30%,70% { opacity: 1; transform: scale(1) rotate(45deg); }
  }
  @keyframes lean {
    0%,100% { transform: rotate(0deg); }
    50% { transform: rotate(-1.5deg); }
  }
</style>
</head>
<body>
<div class="label">ADAM · Rizz</div>
<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Gleam sparkle top-right -->
  <g class="gleam">
    <line x1="260" y1="55" x2="260" y2="69" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="253" y1="62" x2="267" y2="62" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="255" y1="57" x2="265" y2="67" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="265" y1="57" x2="255" y2="67" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g class="face">
    <!-- Left eye: flat wink line -->
    <g class="wink-eye">
      <line x1="80" y1="90" x2="130" y2="90" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Right eye: confident angled arc (slightly narrowed ^) -->
    <g class="cool-eye">
      <path d="M 190 93 Q 215 70 240 93"
        stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Smirk: asymmetric right-weighted smile -->
    <g class="smirk">
      <!-- Left side barely lifts, right side curves more -->
      <path d="M 142 140 Q 155 140 163 136 Q 172 131 184 138"
        stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
</body>
</html>
