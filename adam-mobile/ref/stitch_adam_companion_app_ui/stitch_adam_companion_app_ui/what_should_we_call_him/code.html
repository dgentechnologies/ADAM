r-highest":"#353535","error":"#ffb4ab"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"unit":"8px","stack-lg":"48px","stack-sm":"12px","gutter":"16px","stack-md":"24px","container-padding":"24px"},"fontFamily":{"headline-sm":["Inter"],"body-lg":["Inter"],"headline-md-mobile":["Inter"],"display-lg":["Inter"],"label-md":["Inter"],"headline-md":["Inter"],"body-md":["Inter"]},"fontSize":{"headline-sm":["24px",{"lineHeight":"32px","letterSpacing":"-0.02em","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"400"}],"headline-md-mobile":["32px",{"lineHeight":"36px","letterSpacing":"-0.02em","fontWeight":"700"}],"display-lg":["48px",{"lineHeight":"52px","letterSpacing":"-0.04em","fontWeight":"700"}],"label-md":["14px",{"lineHeight":"20px","letterSpacing":"0.02em","fontWeight":"500"}],"headline-md":["36px",{"lineHeight":"40px","letterSpacing":"-0.03em","fontWeight":"700"}],"body-md":["16px",{"lineHeight":"24px","letterSpacing":"0em","fontWeight":"400"}]}}}}</script></head><body class="bg-background font-body-md text-on-background pt-safe pb-safe"><main class="flex flex-col relative w-full min-h-screen"><div class="flex flex-col w-full h-full justify-between px-container-padding pb-stack-lg relative overflow-hidden" style="min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));">
<!-- Subtle Dot Matrix Background Elements (Digital Skin) -->
<div class="absolute top-0 right-0 w-32 h-32 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle, #fff 1px, transparent 1px); background-size: 8px 8px;"></div>
<div class="absolute bottom-1/4 left-0 w-24 h-48 opacity-[0.02] pointer-events-none" style="background-image: radial-gradient(circle, #fff 1px, transparent 1px); background-size: 8px 8px;"></div>
<!-- Top / Center Content -->
<div class="flex flex-col justify-center flex-grow pt-stack-lg pb-stack-md relative z-10">
<!-- Headline -->
<h1 class="text-display-lg font-display-lg text-primary text-center tracking-tight mb-stack-lg">
      What should<br/>we call him?
    </h1>
<!-- Input Section -->
<div class="flex flex-col items-center justify-center space-y-stack-sm w-full max-w-sm mx-auto">
<!-- Custom Input styling matching "tactile minimalism" -->
<div class="relative w-full group">
<input autocomplete="off" class="w-full bg-transparent text-center text-headline-md font-headline-md text-primary placeholder:text-surface-variant focus:outline-none py-unit px-unit border-b border-surface-variant focus:border-primary transition-colors duration-300" id="name-input" placeholder="ADAM" spellcheck="false" type="text"/>
<!-- Simulated cursor (visible only when not focused, for empty state delight) -->
<div class="absolute left-1/2 top-1/2 -translate-y-1/2 w-[2px] h-8 bg-primary animate-pulse pointer-events-none transition-opacity duration-300" id="simulated-cursor"></div>
</div>
<p class="text-label-md font-label-md text-on-surface-variant opacity-60">
        You can change this anytime.
      </p>
</div>
</div>
<!-- Bottom Action -->
<div class="w-full mt-auto pt-stack-md relative z-10">
<button class="w-full bg-primary text-on-primary py-4 rounded-full text-body-lg font-body-lg font-semibold active:scale-[0.98] transition-transform duration-200 flex items-center justify-center relative overflow-hidden group">
<span class="relative z-10">Continue</span>
<!-- Subtle hover/press ripple effect -->
<div class="absolute inset-0 bg-white/20 opacity-0 group-active:opacity-100 transition-opacity duration-200"></div>
</button>
</div>
</div>
<script>
  // Simple interaction script to handle the simulated cursor
  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('name-input');
    const cursor = document.getElementById('simulated-cursor');
    
    // Hide simulated cursor when input has value or is focused
    const updateCursor = () => {
      if (input.value.length > 0 || document.activeElement === input) {
        cursor.style.opacity = '0';
      } else {
        cursor.style.opacity = '1';
        
        // Slightly offset cursor based on placeholder text width approx
        const placeholderWidth = 100; // rough estimate
        cursor.style.transform = `translate(-50%, -50%) translateX(-${placeholderWidth/2 + 4}px)`;
      }
    };

    input.addEventListener('focus', updateCursor);
    input.addEventListener('blur', updateCursor);
    input.addEventListener('input', updateCursor);
    
    // Initial setup
    setTimeout(updateCursor, 100); // slight delay to ensure fonts load for rough width
  });
</script></main></body></html>
