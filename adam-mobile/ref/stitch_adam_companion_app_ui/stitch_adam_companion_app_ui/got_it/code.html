<!-- Viewfinder Area -->
<div class="relative w-64 h-64 mx-auto mt-stack-md rounded-full overflow-hidden bg-surface-container-lowest shadow-2xl flex-shrink-0">
<!-- Background Image (Camera Feed) -->
<div class="absolute inset-0 bg-cover bg-center opacity-50 grayscale mix-blend-luminosity" data-alt="Monochrome, high-contrast, moody close-up portrait of a person looking directly into the camera lens, cinematic lighting, futuristic minimalism, stark shadows, purely achromatic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDvfclmT32Jbf3Qs1MGrRXI4HHM1EwLwwCALOaPEGO-SmCUfYKLZQzsHDNLSBf6FiOsPyiv88ed9vCQQ5iJ78cEe_UugvJ3fDXzOJyP7A7aCE4NHBYZBbqzgYUbzHXSfNCc6kvCeb0RKiG8NCHZBB3hI10ciK5-NGnfYBVAaohSaCfvbMgEOqR0aVxuLOHSyMcBpGccu_SSn6e5zn6C7TBhNmWF-peGTdhGsyAXxHo-xy0QX0nvB6-3')">
</div>
<!-- Shader Scanning Animation Overlay -->

<!-- Viewfinder Reticle / Crosshairs -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
<svg class="text-primary stroke-current" height="100%" viewbox="0 0 100 100" width="100%">
<line stroke-width="0.5" x1="50" x2="50" y1="0" y2="8"></line>
<line stroke-width="0.5" x1="50" x2="50" y1="92" y2="100"></line>
<line stroke-width="0.5" x1="0" x2="8" y1="50" y2="50"></line>
<line stroke-width="0.5" x1="92" x2="100" y1="50" y2="50"></line>
<!-- Center dot -->
<circle cx="50" cy="50" fill="currentColor" r="1.5"></circle>
</svg>
</div>
</div>
<!-- Confirmation Header -->
<div class="flex flex-col items-center mt-stack-lg text-center animate-fade-in-up">
<div class="flex items-center justify-center gap-unit text-primary mb-stack-sm">
<span class="material-symbols-outlined text-headline-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<h1 class="font-headline-md text-headline-md tracking-tight">Got it.</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] opacity-80">
            Biometric sync complete. Your profile has been securely mapped.
        </p>
</div>
<!-- User Input Section -->
<div class="mt-stack-lg flex flex-col w-full max-w-sm mx-auto flex-grow">
<label class="font-label-md text-label-md text-on-surface-variant mb-stack-sm ml-unit flex items-center gap-2" for="userName">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
            What should ADAM call you?
        </label>
<div class="relative group">
<!-- Simulated Hairline via background shift and inner shadow -->
<input autocomplete="off" class="w-full bg-surface-container text-on-surface rounded-full py-4 px-6 font-body-lg text-body-lg placeholder:text-on-surface-variant focus:outline-none focus:bg-surface-container-high transition-all duration-300 shadow-inner" id="userName" placeholder="Your name" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 opacity-0 group-focus-within:opacity-100 transition-opacity duration-300 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-body-lg">edit</span>
</div>
</div>
</div>
<!-- Floating Action Button -->
<button class="w-full max-w-sm mx-auto mt-stack-lg bg-primary text-on-primary rounded-full py-4 px-8 flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all transform hover:shadow-lg hover:shadow-primary/20">
<span class="font-label-md text-label-md uppercase tracking-widest font-semibold">Save</span>
<span class="material-symbols-outlined text-body-md">arrow_forward</span>
</button>
</div>
<script>
    // Micro-interaction: Auto-focus the input after a slight delay for a seamless entry feel
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const nameInput = document.getElementById('userName');
            if(nameInput) {
                nameInput.focus();
            }
        }, 800);
    });
</script>
<style>
    /* Lightweight fade-in micro-animation for the content */
    @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
