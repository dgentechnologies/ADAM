<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADAM — Panic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: monospace;
  }
  .label {
    color: #fff;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0.4;
  }
  svg { width: 320px; height: 200px; overflow: visible; }
  .face { animation: panic-shake 0.08s ease-in-out infinite; }
  .stress-l { animation: stress-flash 0.6s ease-in-out infinite; }
  .stress-r { animation: stress-flash 0.6s ease-in-out infinite 0.3s; }
  .mouth { animation: mouth-panic 0.15s ease-in-out infinite; transform-origin: 160px 140px; }
  .sweat { animation: sweat-drop 2s ease-in infinite; }
  @keyframes panic-shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-2px,1px); }
    40% { transform: translate(2px,-1px); }
    60% { transform: translate(-1px,2px); }
    80% { transform: translate(1px,-2px); }
  }
  @keyframes stress-flash {
    0%,100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  @keyframes mouth-panic {
    0%,100% { transform: scaleX(1) scaleY(1); }
    50% { transform: scaleX(1.06) scaleY(0.9); }
  }
  @keyframes sweat-drop {
    0%,40% { transform: translateY(0); opacity: 0; }
    50% { opacity: 0.8; }
    100% { transform: translateY(40px); opacity: 0; }
  }
</style>
</head>
<body>
<div class="label">ADAM · Panic</div>
<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <g class="face">
    <!-- Left eye: large oval O -->
    <ellipse cx="103" cy="88" rx="22" ry="28" stroke="#fff" stroke-width="5" fill="none"/>
    <!-- Stress mark left (small comma/dash beside eye) -->
    <g class="stress-l">
      <path d="M 68 72 Q 62 80 65 88" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Right eye: large oval -->
    <ellipse cx="217" cy="88" rx="22" ry="28" stroke="#fff" stroke-width="5" fill="none"/>
    <!-- Stress mark right -->
    <g class="stress-r">
      <path d="M 252 72 Q 258 80 255 88" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Mouth: small zigzag (nervous) -->
    <g class="mouth">
      <path d="M 130 140 Q 140 133 150 140 Q 160 147 170 140 Q 180 133 190 140"
        stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- Sweat drop -->
  <ellipse class="sweat" cx="103" cy="62" rx="4" ry="6" fill="#fff" opacity="0"/>
</svg>
</body>
</html>
