<script>
    document.addEventListener('DOMContentLoaded', () => {
        const checkbox = document.getElementById('terms-checkbox');
        const customCheck = checkbox.nextElementSibling;
        const icon = customCheck.querySelector('.material-symbols-outlined');

        checkbox.addEventListener('change', (e) => {
            if(e.target.checked) {
                // Add a slight pop effect when checked
                customCheck.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    customCheck.style.transform = 'scale(1)';
                }, 150);
            }
        });
    });
