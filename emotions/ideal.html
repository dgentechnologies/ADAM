<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADAM - Ideal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
  }
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: monospace;
    overflow: hidden;
    background: transparent;
  }
  .label {
    display: none;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .eye-l { animation: idle-blink-left 6s ease-in-out infinite; transform-origin: 105px 88px; }
  .eye-r { animation: idle-blink-right 6s ease-in-out infinite 0.08s; transform-origin: 215px 88px; }
  .face { animation: idle-breathe 6s ease-in-out infinite; transform-origin: 160px 100px; }
  .mouth { animation: idle-mouth 6s ease-in-out infinite; transform-origin: 160px 138px; }

  @keyframes idle-blink-left {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.06); }
  }
  @keyframes idle-blink-right {
    0%, 90%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.06); }
  }
  @keyframes idle-breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(1px); }
  }
  @keyframes idle-mouth {
    0%, 100% { opacity: 0.55; transform: scaleX(1); }
    50% { opacity: 0.75; transform: scaleX(1.03); }
  }
</style>
</head>
<body>
<div class="label">ADAM - Ideal</div>
<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <g class="face">
    <g class="eye-l">
      <rect x="86" y="84" width="42" height="8" rx="4" fill="#fff" />
    </g>
    <g class="eye-r">
      <rect x="196" y="84" width="42" height="8" rx="4" fill="#fff" />
    </g>
    <g class="mouth">
      <rect class="mouth" x="148" y="134" width="24" height="5" rx="3" fill="#fff" opacity="0.7" />
    </g>
  </g>
</svg>
</body>
</html>
