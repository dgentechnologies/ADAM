<!-- STITCH_SHADER_START:ANIMATION_16 class="relative w-full aspect-square z-10 mix-blend-screen opacity-90" -->
<div class="relative w-full aspect-square z-10 mix-blend-screen opacity-90" style="display:block;">
<canvas id="shader-canvas-ANIMATION_16" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_16');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;

varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

// Helper for rounded rectangles (ADAM eyes)
float sdRoundedRect(vec2 p, vec2 b, float r) {
    vec2 q = abs(p) - b + r;
    return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}

// Subtle grain/dot-matrix pattern
float grain(vec2 uv) {
    float strength = 0.03;
    return (fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * strength;
}

void main() {
    vec2 uv = v_texCoord;
    vec2 p = (uv - 0.5) * 2.0;
    p.x *= u_resolution.x / u_resolution.y;

    // Background: Pure Black
    vec3 color = vec3(0.0);

    // ASCII / Dot-Matrix texture (faint in corners)
    float dotGrid = sin(uv.x * 250.0) * sin(uv.y * 250.0);
    float cornerMask = pow(length(uv - 0.5) * 1.2, 2.0); 
    color += smoothstep(0.8, 1.0, dotGrid) * 0.03 * cornerMask;

    // Radar Scanning Animation
    float dist = length(p);
    
    // Multiple concentric rings pulsing outward
    for(float i = 0.0; i < 3.0; i++) {
        float pulse = mod(u_time * 0.5 + i * 0.4, 1.2);
        float ring = smoothstep(0.015, 0.0, abs(dist - pulse));
        float fade = 1.0 - smoothstep(0.3, 1.2, pulse);
        color += ring * fade * 0.4;
    }
    
    // Rotating sweep line
    float angle = atan(p.y, p.x);
    float sweep = mod(angle / 6.2831 + u_time * 0.3, 1.0);
    float sweepLine = smoothstep(0.98, 1.0, sweep) * (1.0 - smoothstep(0.8, 1.0, dist));
    color += sweepLine * 0.15;

    // ADAM Eyes (Geometric Center Mark)
    float blink = 1.0;
    float eyeWidth = 0.06;
    float eyeHeight = 0.02 * blink;
    float eyeRadius = 0.01;
    float eyeSpacing = 0.05;

    // Left Eye
    vec2 pLeft = p - vec2(-eyeSpacing, 0.0);
    float dLeft = sdRoundedRect(pLeft, vec2(eyeWidth, eyeHeight), eyeRadius);
    float eyeMask = 1.0 - smoothstep(0.0, 0.005, dLeft);

    // Right Eye
    vec2 pRight = p - vec2(eyeSpacing, 0.0);
    float dRight = sdRoundedRect(pRight, vec2(eyeWidth, eyeHeight), eyeRadius);
    eyeMask += 1.0 - smoothstep(0.0, 0.005, dRight);

    // Combine eyes
    color = mix(color, vec3(1.0), eyeMask);
    
    // Add subtle grain
    color += grain(uv);

    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
