UtoNd1kYHLk6s6oU0DebVKUQCpYiRjt5NVQ5tfPo4VBOpOQgY6L_UL6czvAycUQdPYbN3x8Dau1uDdpGJP1tEcrRnwDofXHjavDo1Z_dIONJOs79mck-pjo8o14FF2lTRhAFUC9_B23M8JB4ukdBc7Cuop0CfWgNoBeN-4TUulc2zdr5lQ5lqhzNX6KwooGphUi6yotjeVjkUEvCWWRSorW4dF9G5ColneSD"/></div></header><main class="flex flex-col relative w-full pt-16 min-h-screen bg-transparent"><div class="flex flex-col w-full px-container-padding py-stack-md gap-stack-lg relative overflow-hidden" id="update-container">
<div class="absolute inset-0 pointer-events-none opacity-5" style="background-image: radial-gradient(#e2e2e2 1px, transparent 1px); background-size: 24px 24px;"></div>
<div class="flex flex-col gap-unit">
<h1 class="font-headline-md text-headline-md-mobile text-on-background relative z-10">Software Update</h1>
</div>
<div class="flex flex-col gap-stack-md relative z-10 w-full">
<div class="bg-surface-container-low rounded-[24px] p-container-padding flex flex-col gap-stack-sm shadow-sm relative overflow-hidden group border border-[#2C2C2E]">
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="flex items-center gap-gutter mb-unit relative z-10">
<div class="w-12 h-12 rounded-full bg-surface-container-high border border-[#3A3A3C] flex items-center justify-center relative">
<span class="material-symbols-outlined text-on-surface text-xl">system_update_alt</span>
<div class="absolute top-0 right-0 w-3 h-3 bg-tertiary rounded-full border-2 border-surface-container-low" style="box-shadow: 0 0 10px rgba(255,255,255,0.5)"></div>
</div>
<div class="flex flex-col">
<h2 class="font-headline-sm text-headline-sm text-on-surface">ADAM OS</h2>
<span class="font-body-md text-body-md text-on-surface-variant">Version 40.2.1</span>
</div>
</div>
<div class="flex flex-col gap-1 relative z-10">
<span class="font-body-lg text-body-lg text-on-surface">Up to date</span>
<span class="font-label-md text-label-md text-on-surface-variant">Last checked: Just now</span>
</div>
</div>
<div class="bg-surface-container-low rounded-[24px] p-container-padding border border-[#2C2C2E] flex items-center justify-between shadow-sm relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="flex flex-col gap-1 relative z-10 w-3/4">
<span class="font-body-lg text-body-lg text-on-surface">Notify me about updates</span>
<span class="font-label-md text-label-md text-on-surface-variant line-clamp-2">Receive push notifications when a new version of ADAM OS is available.</span>
</div>
<label class="relative inline-flex items-center cursor-pointer z-10 shrink-0">
<input checked="" class="sr-only peer" id="update-toggle" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-container-high peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-6 after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-white after:border after:rounded-full after:h-6 after:w-6 after:transition-all border border-[#3A3A3C]"></div>
</label>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggle = document.getElementById('update-toggle');
        const container = document.getElementById('update-container');

        toggle.addEventListener('change', (e) => {
            if(e.target.checked) {
                // Subtle feedback animation
                const feedback = document.createElement('div');
                feedback.className = 'absolute bottom-8 left-1/2 -translate-x-1/2 bg-on-surface text-surface px-6 py-3 rounded-full font-label-md text-label-md shadow-xl transition-all duration-300 opacity-0 transform translate-y-4';
                feedback.textContent = 'Notifications Enabled';
                container.appendChild(feedback);
                
                requestAnimationFrame(() => {
                    feedback.classList.remove('opacity-0', 'translate-y-4');
                    feedback.classList.add('opacity-100', 'translate-y-0');
                });

                setTimeout(() => {
                    feedback.classList.remove('opacity-100', 'translate-y-0');
                    feedback.classList.add('opacity-0', 'translate-y-4');
                    setTimeout(() => feedback.remove(), 300);
                }, 2000);
            }
        });
    });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-background/60 backdrop-blur-2xl" data-active-classes="text-primary"><div class="flex justify-around items-center h-20 px-4"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-16 h-16 transition-all text-primary" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="font-label-md text-label-md">Home</span></a><a class="flex flex-col items-center justify-center gap-1 w-16 h-16 text-outline transition-all" data-path="status" href="#"><span class="material-symbols-outlined">analytics</span><span class="font-label-md text-label-md">Status</span></a><a class="flex flex-col items-center justify-center gap-1 w-16 h-16 text-outline transition-all" data-path="commands" href="#"><span class="material-symbols-outlined">terminal</span><span class="font-label-md text-label-md">Commands</span></a><a class="flex flex-col items-center justify-center gap-1 w-16 h-16 text-outline transition-all" data-path="settings" href="#"><span class="material-symbols-outlined">settings</span><span class="font-label-md text-label-md">Settings</span></a></div></nav></body></html>
