name: Firebase contract
on:
  push:
    paths: ['firebase/**', 'firebase.json', 'adam-mobile/firestore.rules', '.github/workflows/firebase-contract.yml']
  pull_request:
    paths: ['firebase/**', 'firebase.json', 'adam-mobile/firestore.rules', '.github/workflows/firebase-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: firebase
      - run: npm test
        working-directory: firebase
      - run: npm run test:emulator
        working-directory: firebase
