<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ADAM — Search / Thinking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: monospace;
  }
  .label {
    color: #fff;
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 28px;
    opacity: 0.3;
  }
  svg { width: 340px; height: 220px; overflow: visible; }

  .eye-l { animation: scan-l 1.6s linear infinite; }
  .eye-r { animation: scan-r 1.6s linear infinite 0.25s; }
  .mouth { animation: mouth-think 2s ease-in-out infinite; transform-origin: 160px 140px; }
  .cursor { animation: cursor-blink 0.9s steps(1) infinite; }
  .scan-beam { animation: beam-sweep 2s ease-in-out infinite; }

  @keyframes scan-l {
    0%,100% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
  }
  @keyframes scan-r {
    0%,100% { transform: translateX(6px); }
    50% { transform: translateX(-6px); }
  }
  @keyframes mouth-think {
    0%,100% { opacity: 0.6; transform: scaleX(1); }
    50% { opacity: 1; transform: scaleX(1.07); }
  }
  @keyframes cursor-blink {
    0%,49% { opacity: 1; }
    50%,100% { opacity: 0; }
  }
  @keyframes beam-sweep {
    0% { transform: translateX(-80px); opacity: 0; }
    20% { opacity: 0.12; }
    80% { opacity: 0.12; }
    100% { transform: translateX(80px); opacity: 0; }
  }
</style>
</head>
<body>
<div class="label">ADAM · Search / Thinking</div>
<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Scan beam -->
  <rect class="scan-beam" x="140" y="20" width="40" height="160" fill="#fff" rx="20"/>

  <!-- Left eye: zigzag wave -->
  <g class="eye-l">
    <path d="M 70 88 Q 80 78 92 88 Q 104 98 116 88 Q 128 78 138 88"
      stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Right eye: zigzag wave -->
  <g class="eye-r">
    <path d="M 180 88 Q 192 78 204 88 Q 216 98 228 88 Q 240 78 252 88"
      stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Mouth: flat line -->
  <g class="mouth">
    <line x1="133" y1="140" x2="187" y2="140" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Blinking cursor after mouth -->
  <rect class="cursor" x="192" y="134" width="3" height="12" fill="#fff" rx="1"/>
</svg>
</body>
</html>
