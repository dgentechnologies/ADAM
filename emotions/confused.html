<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAM — Confused</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }
        svg { width: 100%; height: 100%; display: block; }

        .face-group {
            animation: head-tilt 4s ease-in-out infinite;
            transform-origin: 160px 100px;
        }
        .mouth {
            animation: mouth-flat 2s ease-in-out infinite;
            transform-origin: 160px 142px;
        }
        .question {
            animation: question-bob 2.5s ease-in-out infinite;
            transform-origin: 265px 52px;
        }

        @keyframes mouth-flat {
            0%, 100% { transform: scaleX(1); opacity: 0.7; }
            50%       { transform: scaleX(0.82); opacity: 1; }
        }
        @keyframes question-bob {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 1; }
            50%       { transform: translateY(-10px) rotate(8deg); opacity: 1; }
        }
        @keyframes head-tilt {
            0%, 100% { transform: rotate(1deg); }
            50%       { transform: rotate(-5deg); }
        }
    </style>
</head>
